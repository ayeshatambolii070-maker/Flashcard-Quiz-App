<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Quiz App - CodeAlpha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Flashcard Quiz App</h1>
<div class="card" id="card">
<h2 id="question">Loading...</h2>
<p id="answer"></p>
</div>
<div class="buttons">
<button id="prevBtn">Previous</button>
<button id="showBtn">Show Answer</button>
<button id="nextBtn">Next</button>
</div>
<div class="actions">
<button id="editBtn">Edit</button>
<button id="deleteBtn">Delete</button>
</div>
<div class="add-form">
<h3>Add New Flashcard</h3>
<input type="text" id="newQuestion" placeholder="Enter Question">
<input type="text" id="newAnswer" placeholder="Enter Answer">
<button id="addBtn">Add Flashcard</button>
</div>
<p id="counter"></p>
</div>
<script src="script.js"></script>
</body>
</html>
